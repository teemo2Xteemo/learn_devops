apiVersion: v1
kind: Pod
metadata:
  name: web-app-demo
  labels:
    app: web-app
spec:
  containers:
  - name: nginx-container
    image: nginx:1.25-alpine
    ports:
    - containerPort: 80

    # 1. Quản lý Tài nguyên (Resource Management)
    resources:
      requests:
        memory: "64Mi"
        cpu: "100m"      # 100m = 0.1 CPU core
      limits:
        memory: "128Mi"
        cpu: "200m"

    # 2. Readiness Probe (Kiểm tra ứng dụng sẵn sàng nhận request)
    readinessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 5
      periodSeconds: 5
      failureThreshold: 2

    # 3. Liveness Probe (Kiểm tra tiến trình container còn sống không)
    livenessProbe:
      httpGet:
        path: /
        port: 80
      initialDelaySeconds: 10
      periodSeconds: 10
      failureThreshold: 3