version: "3.8"

services:
  # Backend 1: API Service
  api_service:
    image: python:3.10-slim
    command: python -m http.server 8080
    networks:
      - app_net

  # Backend 2: Web Service
  web_service:
    image: python:3.10-slim
    command: python -m http.server 8080
    networks:
      - app_net

  # Nginx Reverse Proxy
  nginx_proxy:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api_service
      - web_service
    networks:
      - app_net

networks:
  app_net:
    driver: bridge
